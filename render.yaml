services:
  - type: worker
    name: uid-verification
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: HEADLESS
        value: "true"
      - key: POLL_SECONDS
        value: "2"
